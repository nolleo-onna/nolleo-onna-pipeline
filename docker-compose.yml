version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: nolleo-postgres
    environment:
      POSTGRES_DB: nolleo_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nolleo_pipeline"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
