[project]
name = "nolleo-pipeline"
version = "0.1.0"
description = "Nolleo-Onna TourAPI data pipeline"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "alembic==1.16.4",
  "apscheduler==3.11.0",
  "httpx==0.28.1",
  "openai==1.99.9",
  "psycopg[binary,pool]==3.2.9",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.42",
  "structlog==25.4.0",
  "tenacity==9.1.2",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.8",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/nolleo_pipeline"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
