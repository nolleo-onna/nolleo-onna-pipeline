[project]
name = "nolleo-pipeline"
version = "0.1.0"
description = "Nolleo-Onna TourAPI data pipeline"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "psycopg[binary,pool]>=3.2,<4.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "openai>=1.0,<2.0",
  "tenacity>=9.0,<10.0",
  "structlog>=24.0,<25.0",
  "apscheduler>=3.10,<4.0",
  "alembic>=1.13,<2.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<6.0",
  "mypy>=1.0,<2.0",
  "ruff>=0.5,<1.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
